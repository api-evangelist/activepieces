      path: /folders
      operations:
      - name: listfolders
        method: GET
        description: Activepieces List Folders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: query
          type: string
          description: Project ID
          required: true
        - name: limit
          in: query
          type: integer
          description: Number of results
        - name: cursor
          in: query
          type: string
          description: Pagination cursor
      - name: createfolder
        method: POST
        description: Activepieces Create Folder
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
