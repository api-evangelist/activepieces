    resources:
    - path: /v1/folders
      name: folders
      description: REST surface for folders.
      operations:
      - method: GET
        name: listfolders
        description: Activepieces List Folders
        call: activepieces-folders.listfolders
        with:
          projectId: rest.projectId
          limit: rest.limit
          cursor: rest.cursor
        outputParameters:
        - type: object
