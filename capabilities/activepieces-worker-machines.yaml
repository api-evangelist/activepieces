naftiko: 1.0.0-alpha2
info:
  label: Activepieces API — Worker Machines
  description: 'Activepieces API — Worker Machines. 1 operations. Lead operation: Activepieces Get Worker Queue Metrics. Self-contained
    Naftiko capability covering one Activepieces business surface.'
  tags:
  - Activepieces
  - Worker Machines
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ACTIVEPIECES_API_KEY: ACTIVEPIECES_API_KEY
capability:
  consumes:
  - type: http
    namespace: activepieces-worker-machines
    baseUri: https://cloud.activepieces.com/api/v1
    description: Activepieces API — Worker Machines business capability. Self-contained, no shared references.
    resources:
    - name: worker-queues
      path: /worker/queues
      operations:
      - name: getworkerqueuemetrics
        method: GET
        description: Activepieces Get Worker Queue Metrics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.ACTIVEPIECES_API_KEY}}'
  exposes:
  - type: rest
    namespace: activepieces-worker-machines-rest
    port: 8080
    description: REST adapter for Activepieces API — Worker Machines. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/worker/queues
      name: worker-queues
      description: REST surface for worker-queues.
      operations:
      - method: GET
        name: getworkerqueuemetrics
        description: Activepieces Get Worker Queue Metrics
        call: activepieces-worker-machines.getworkerqueuemetrics
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: activepieces-worker-machines-mcp
    port: 9090
    transport: http
    description: MCP adapter for Activepieces API — Worker Machines. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: activepieces-get-worker-queue-metrics
      description: Activepieces Get Worker Queue Metrics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: activepieces-worker-machines.getworkerqueuemetrics
      outputParameters:
      - type: object
        mapping: $.
