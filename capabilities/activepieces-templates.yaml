naftiko: 1.0.0-alpha2
info:
  label: Activepieces API — Templates
  description: 'Activepieces API — Templates. 2 operations. Lead operation: Activepieces List Templates. Self-contained Naftiko
    capability covering one Activepieces business surface.'
  tags:
  - Activepieces
  - Templates
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ACTIVEPIECES_API_KEY: ACTIVEPIECES_API_KEY
capability:
  consumes:
  - type: http
    namespace: activepieces-templates
    baseUri: https://cloud.activepieces.com/api/v1
    description: Activepieces API — Templates business capability. Self-contained, no shared references.
    resources:
    - name: templates
      path: /templates
      operations:
      - name: listtemplates
        method: GET
        description: Activepieces List Templates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
          description: Number of results
        - name: cursor
          in: query
          type: string
          description: Pagination cursor
      - name: createtemplate
        method: POST
        description: Activepieces Create Template
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.ACTIVEPIECES_API_KEY}}'
  exposes:
  - type: rest
    namespace: activepieces-templates-rest
    port: 8080
    description: REST adapter for Activepieces API — Templates. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/templates
      name: templates
      description: REST surface for templates.
      operations:
      - method: GET
        name: listtemplates
        description: Activepieces List Templates
        call: activepieces-templates.listtemplates
        with:
          limit: rest.limit
          cursor: rest.cursor
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createtemplate
        description: Activepieces Create Template
        call: activepieces-templates.createtemplate
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: activepieces-templates-mcp
    port: 9090
    transport: http
    description: MCP adapter for Activepieces API — Templates. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: activepieces-list-templates
      description: Activepieces List Templates
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: activepieces-templates.listtemplates
      with:
        limit: tools.limit
        cursor: tools.cursor
      outputParameters:
      - type: object
        mapping: $.
    - name: activepieces-create-template
      description: Activepieces Create Template
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: activepieces-templates.createtemplate
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
