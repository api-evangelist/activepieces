naftiko: 1.0.0-alpha2
info:
  label: Activepieces API — Pieces
  description: 'Activepieces API — Pieces. 1 operations. Lead operation: Activepieces List Pieces. Self-contained Naftiko
    capability covering one Activepieces business surface.'
  tags:
  - Activepieces
  - Pieces
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ACTIVEPIECES_API_KEY: ACTIVEPIECES_API_KEY
capability:
  consumes:
  - type: http
    namespace: activepieces-pieces
    baseUri: https://cloud.activepieces.com/api/v1
    description: Activepieces API — Pieces business capability. Self-contained, no shared references.
    resources:
    - name: pieces
      path: /pieces
      operations:
      - name: listpieces
        method: GET
        description: Activepieces List Pieces
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: edition
          in: query
          type: string
          description: Filter by edition
        - name: includeHidden
          in: query
          type: boolean
          description: Include hidden pieces
    authentication:
      type: bearer
      token: '{{env.ACTIVEPIECES_API_KEY}}'
  exposes:
  - type: rest
    namespace: activepieces-pieces-rest
    port: 8080
    description: REST adapter for Activepieces API — Pieces. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/pieces
      name: pieces
      description: REST surface for pieces.
      operations:
      - method: GET
        name: listpieces
        description: Activepieces List Pieces
        call: activepieces-pieces.listpieces
        with:
          edition: rest.edition
          includeHidden: rest.includeHidden
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: activepieces-pieces-mcp
    port: 9090
    transport: http
    description: MCP adapter for Activepieces API — Pieces. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: activepieces-list-pieces
      description: Activepieces List Pieces
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: activepieces-pieces.listpieces
      with:
        edition: tools.edition
        includeHidden: tools.includeHidden
      outputParameters:
      - type: object
        mapping: $.
