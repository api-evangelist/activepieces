naftiko: 1.0.0-alpha2
info:
  label: Activepieces API — Connections
  description: 'Activepieces API — Connections. 3 operations. Lead operation: Activepieces List Connections. Self-contained
    Naftiko capability covering one Activepieces business surface.'
  tags:
  - Activepieces
  - Connections
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ACTIVEPIECES_API_KEY: ACTIVEPIECES_API_KEY
capability:
  consumes:
  - type: http
    namespace: activepieces-connections
    baseUri: https://cloud.activepieces.com/api/v1
    description: Activepieces API — Connections business capability. Self-contained, no shared references.
    resources:
    - name: connections
      path: /connections
      operations:
      - name: listconnections
        method: GET
        description: Activepieces List Connections
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: query
          type: string
          description: Project ID
          required: true
        - name: pieceName
          in: query
          type: string
          description: Filter by piece name
        - name: limit
          in: query
          type: integer
          description: Number of results
        - name: cursor
          in: query
          type: string
          description: Pagination cursor
      - name: upsertconnection
        method: POST
        description: Activepieces Upsert Connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: connections-id
      path: /connections/{id}
      operations:
      - name: deleteconnection
        method: DELETE
        description: Activepieces Delete Connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Connection ID
          required: true
    authentication:
      type: bearer
      token: '{{env.ACTIVEPIECES_API_KEY}}'
  exposes:
  - type: rest
    namespace: activepieces-connections-rest
    port: 8080
    description: REST adapter for Activepieces API — Connections. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/connections
      name: connections
      description: REST surface for connections.
      operations:
      - method: GET
        name: listconnections
        description: Activepieces List Connections
        call: activepieces-connections.listconnections
        with:
          projectId: rest.projectId
          pieceName: rest.pieceName
          limit: rest.limit
          cursor: rest.cursor
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: upsertconnection
        description: Activepieces Upsert Connection
        call: activepieces-connections.upsertconnection
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/connections/{id}
      name: connections-id
      description: REST surface for connections-id.
      operations:
      - method: DELETE
        name: deleteconnection
        description: Activepieces Delete Connection
        call: activepieces-connections.deleteconnection
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: activepieces-connections-mcp
    port: 9090
    transport: http
    description: MCP adapter for Activepieces API — Connections. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: activepieces-list-connections
      description: Activepieces List Connections
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: activepieces-connections.listconnections
      with:
        projectId: tools.projectId
        pieceName: tools.pieceName
        limit: tools.limit
        cursor: tools.cursor
      outputParameters:
      - type: object
        mapping: $.
    - name: activepieces-upsert-connection
      description: Activepieces Upsert Connection
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: activepieces-connections.upsertconnection
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: activepieces-delete-connection
      description: Activepieces Delete Connection
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: activepieces-connections.deleteconnection
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
