openapi: 3.2.0
info:
  title: Activepieces Documentation App Connections API
  version: 0.0.0
servers:
- url: https://cloud.activepieces.com/api
  description: Production Server
tags:
- name: app-connections
paths:
  /v1/app-connections:
    post:
      tags:
      - app-connections
      description: Upsert an app connection based on the app name
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                properties:
                  externalId:
                    type: string
                  displayName:
                    type: string
                  pieceName:
                    type: string
                  projectId:
                    type: string
                  metadata:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                  pieceVersion:
                    type: string
                  type:
                    type: string
                    enum:
                    - SECRET_TEXT
                  value:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - SECRET_TEXT
                      secret_text:
                        type: string
                        minLength: 1
                    required:
                    - type
                    - secret_text
                required:
                - externalId
                - displayName
                - pieceName
                - projectId
                - type
                - value
                description: Secret Text
              - type: object
                properties:
                  externalId:
                    type: string
                  displayName:
                    type: string
                  pieceName:
                    type: string
                  projectId:
                    type: string
                  metadata:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                  pieceVersion:
                    type: string
                  type:
                    type: string
                    enum:
                    - OAUTH2
                  value:
                    type: object
                    properties:
                      client_id:
                        type: string
                        minLength: 1
                      code:
                        type: string
                        minLength: 1
                      code_challenge:
                        type: string
                      scope:
                        type: string
                      authorization_method:
                        type: string
                        enum:
                        - HEADER
                        - BODY
                      client_secret:
                        type: string
                        minLength: 1
                      grant_type:
                        type: string
                        enum:
                        - authorization_code
                        - client_credentials
                      props:
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties: {}
                      redirect_url:
                        type: string
                        minLength: 1
                      type:
                        type: string
                        enum:
                        - OAUTH2
                    required:
                    - client_id
                    - code
                    - scope
                    - client_secret
                    - redirect_url
                    - type
                required:
                - externalId
                - displayName
                - pieceName
                - projectId
                - type
                - value
                description: OAuth2
              - type: object
                properties:
                  externalId:
                    type: string
                  displayName:
                    type: string
                  pieceName:
                    type: string
                  projectId:
                    type: string
                  metadata:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                  pieceVersion:
                    type: string
                  type:
                    type: string
                    enum:
                    - CLOUD_OAUTH2
                  value:
                    type: object
                    properties:
                      client_id:
                        type: string
                        minLength: 1
                      code:
                        type: string
                        minLength: 1
                      code_challenge:
                        type: string
                      scope:
                        type: string
                      authorization_method:
                        type: string
                        enum:
                        - HEADER
                        - BODY
                      props:
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties: {}
                      type:
                        type: string
                        enum:
                        - CLOUD_OAUTH2
                    required:
                    - client_id
                    - code
                    - scope
                    - type
                required:
                - externalId
                - displayName
                - pieceName
                - projectId
                - type
                - value
                description: Cloud OAuth2
              - type: object
                properties:
                  externalId:
                    type: string
                  displayName:
                    type: string
                  pieceName:
                    type: string
                  projectId:
                    type: string
                  metadata:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                  pieceVersion:
                    type: string
                  type:
                    type: string
                    enum:
                    - PLATFORM_OAUTH2
                  value:
                    type: object
                    properties:
                      client_id:
                        type: string
                        minLength: 1
                      code:
                        type: string
                        minLength: 1
                      code_challenge:
                        type: string
                      scope:
                        type: string
                      authorization_method:
                        type: string
                        enum:
                        - HEADER
                        - BODY
                      props:
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties: {}
                      type:
                        type: string
                        enum:
                        - PLATFORM_OAUTH2
                      redirect_url:
                        type: string
                        minLength: 1
                    required:
                    - client_id
                    - code
                    - scope
                    - type
                    - redirect_url
                required:
                - externalId
                - displayName
                - pieceName
                - projectId
                - type
                - value
                description: Platform OAuth2
              - type: object
                properties:
                  externalId:
                    type: string
                  displayName:
                    type: string
                  pieceName:
                    type: string
                  projectId:
                    type: string
                  metadata:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                  pieceVersion:
                    type: string
                  type:
                    type: string
                    enum:
                    - BASIC_AUTH
                  value:
                    type: object
                    properties:
                      username:
                        type: string
                        minLength: 1
                      password:
                        type: string
                        minLength: 1
                      type:
                        type: string
                        enum:
                        - BASIC_AUTH
                    required:
                    - username
                    - password
                    - type
                required:
                - externalId
                - displayName
                - pieceName
                - projectId
                - type
                - value
                description: Basic Auth
              - type: object
                properties:
                  externalId:
                    type: string
                  displayName:
                    type: string
                  pieceName:
                    type: string
                  projectId:
                    type: string
                  metadata:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                  pieceVersion:
                    type: string
                  type:
                    type: string
                    enum:
                    - CUSTOM_AUTH
                  value:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - CUSTOM_AUTH
                      props:
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties: {}
                    required:
                    - type
                    - props
                required:
                - externalId
                - displayName
                - pieceName
                - projectId
                - type
                - value
                description: Custom Auth
              - type: object
                properties:
                  externalId:
                    type: string
                  displayName:
                    type: string
                  pieceName:
                    type: string
                  projectId:
                    type: string
                  metadata:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                  pieceVersion:
                    type: string
                  type:
                    type: string
                    enum:
                    - NO_AUTH
                  value:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - NO_AUTH
                    required:
                    - type
                required:
                - externalId
                - displayName
                - pieceName
                - projectId
                - type
                - value
                description: No Auth
              - type: object
                properties:
                  externalId:
                    type: string
                  displayName:
                    type: string
                  pieceName:
                    type: string
                  projectId:
                    type: string
                  metadata:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                  pieceVersion:
                    type: string
                  type:
                    type: string
                    enum:
                    - PLACEHOLDER
                required:
                - externalId
                - displayName
                - pieceName
                - projectId
                - type
                description: Placeholder
      security:
      - apiKey: []
      responses:
        '200':
          description: Default Response
      summary: Create app connections
      x-summary-source: derived
      operationId: postV1AppConnections
      x-operation-id-source: derived
    get:
      tags:
      - app-connections
      description: List app connections
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
      - schema:
          type: string
        in: query
        name: projectId
        required: true
      - schema:
          type: string
          enum:
          - PROJECT
          - PLATFORM
        in: query
        name: scope
        required: false
      - schema:
          type: string
        in: query
        name: pieceName
        required: false
      - schema:
          type: string
        in: query
        name: displayName
        required: false
      - schema:
          type: array
          items:
            type: string
            enum:
            - ACTIVE
            - MISSING
            - ERROR
        in: query
        name: status
        required: true
      - schema:
          type: number
        in: query
        name: limit
        required: false
      security:
      - apiKey: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/app-connection'
                  next:
                    anyOf:
                    - type: string
                    - type: 'null'
                  previous:
                    anyOf:
                    - type: string
                    - type: 'null'
                required:
                - data
                additionalProperties: false
      summary: Get app connections
      x-summary-source: derived
      operationId: getV1AppConnections
      x-operation-id-source: derived
  /v1/app-connections/{id}:
    get:
      tags:
      - app-connections
      description: Get an app connection by id
      parameters:
      - schema:
          type: string
          pattern: ^[0-9a-zA-Z]{21}$
        in: path
        name: id
        required: true
      security:
      - apiKey: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/app-connection'
      summary: Get app connections by id
      x-summary-source: derived
      operationId: getV1AppConnectionsById
      x-operation-id-source: derived
    post:
      tags:
      - app-connections
      description: Update an app connection value
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  minLength: 1
                metadata:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
              required:
              - displayName
        required: true
      parameters:
      - schema:
          type: string
          pattern: ^[0-9a-zA-Z]{21}$
        in: path
        name: id
        required: true
      security:
      - apiKey: []
      responses:
        '200':
          description: Default Response
      summary: Create app connections by id
      x-summary-source: derived
      operationId: postV1AppConnectionsById
      x-operation-id-source: derived
    delete:
      tags:
      - app-connections
      description: Delete an app connection
      parameters:
      - schema:
          type: string
          pattern: ^[0-9a-zA-Z]{21}$
        in: path
        name: id
        required: true
      security:
      - apiKey: []
      responses:
        '204':
          description: Default Response
          content:
            application/json:
              schema:
                not: {}
      summary: Delete app connections by id
      x-summary-source: derived
      operationId: deleteV1AppConnectionsById
      x-operation-id-source: derived
  /v1/app-connections/owners:
    get:
      tags:
      - app-connections
      description: List app connection owners
      parameters:
      - schema:
          type: string
        in: query
        name: projectId
        required: true
      security:
      - apiKey: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        firstName:
                          type: string
                        lastName:
                          type: string
                        email:
                          type: string
                      required:
                      - firstName
                      - lastName
                      - email
                      additionalProperties: false
                  next:
                    anyOf:
                    - type: string
                    - type: 'null'
                  previous:
                    anyOf:
                    - type: string
                    - type: 'null'
                required:
                - data
                additionalProperties: false
      summary: Get app connections owners
      x-summary-source: derived
      operationId: getV1AppConnectionsOwners
      x-operation-id-source: derived
  /v1/app-connections/replace:
    post:
      tags:
      - app-connections
      description: Replace app connections
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sourceAppConnectionId:
                  type: string
                targetAppConnectionId:
                  type: string
                projectId:
                  type: string
              required:
              - sourceAppConnectionId
              - targetAppConnectionId
              - projectId
        required: true
      security:
      - apiKey: []
      responses:
        '204':
          description: Default Response
          content:
            application/json:
              schema:
                not: {}
      summary: Create app connections replace
      x-summary-source: derived
      operationId: postV1AppConnectionsReplace
      x-operation-id-source: derived
  /v1/app-connections/oauth2/authorization-url:
    post:
      tags:
      - app-connections
      description: Get OAuth2 authorization URL
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pieceName:
                  type: string
                pieceVersion:
                  type: string
                projectId:
                  type: string
                clientId:
                  type: string
                redirectUrl:
                  type: string
                props:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
              required:
              - pieceName
              - clientId
              - redirectUrl
        required: true
      security:
      - apiKey: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizationUrl:
                    type: string
                  codeVerifier:
                    type: string
                required:
                - authorizationUrl
                additionalProperties: false
      summary: Create app connections oauth2 authorization url
      x-summary-source: derived
      operationId: postV1AppConnectionsOauth2AuthorizationUrl
      x-operation-id-source: derived
components:
  schemas:
    user:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/user'
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        externalId:
          anyOf:
          - type: string
          - type: 'null'
        platformId:
          anyOf:
          - type: string
          - type: 'null'
        platformRole:
          type: string
          enum:
          - ADMIN
          - MEMBER
          - OPERATOR
        lastName:
          type: string
        created:
          type: string
        updated:
          type: string
        lastActiveDate:
          anyOf:
          - type: string
          - type: 'null'
        imageUrl:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - email
      - firstName
      - status
      - platformRole
      - lastName
      - created
      - updated
      additionalProperties: false
    app-connection:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/app-connection'
      type: object
      properties:
        id:
          type: string
        created:
          type: string
        updated:
          type: string
        externalId:
          type: string
        displayName:
          type: string
        type:
          type: string
          enum:
          - OAUTH2
          - PLATFORM_OAUTH2
          - CLOUD_OAUTH2
          - SECRET_TEXT
          - BASIC_AUTH
          - CUSTOM_AUTH
          - NO_AUTH
        pieceName:
          type: string
        projectIds:
          type: array
          items:
            type: string
            pattern: ^[0-9a-zA-Z]{21}$
        platformId:
          anyOf:
          - type: string
          - type: 'null'
        scope:
          type: string
          enum:
          - PROJECT
          - PLATFORM
        status:
          type: string
          enum:
          - ACTIVE
          - MISSING
          - ERROR
        ownerId:
          anyOf:
          - type: string
          - type: 'null'
        owner:
          anyOf:
          - $ref: '#/components/schemas/user'
          - type: 'null'
        metadata:
          anyOf:
          - type: object
            propertyNames:
              type: string
            additionalProperties: {}
          - type: 'null'
        flowIds:
          anyOf:
          - type: array
            items:
              type: string
              pattern: ^[0-9a-zA-Z]{21}$
          - type: 'null'
        pieceVersion:
          type: string
        preSelectForNewProjects:
          type: boolean
        usingSecretManager:
          type: boolean
      required:
      - id
      - created
      - updated
      - externalId
      - displayName
      - type
      - pieceName
      - projectIds
      - scope
      - status
      - pieceVersion
      - preSelectForNewProjects
      - usingSecretManager
      additionalProperties: false
  securitySchemes:
    apiKey:
      type: http
      description: Use your api key generated from the admin console
      scheme: bearer
externalDocs:
  url: https://www.activepieces.com/docs
  description: Find more info here
