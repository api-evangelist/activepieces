openapi: 3.2.0
info:
  title: Activepieces Flow Runs API
  x-refined-note:
  - x-generated-from differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged flow-runs across 2 of this provider''s published API definitions: activepieces-openapi.json, activepieces.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://cloud.activepieces.com/api
  description: Production Server
- url: https://cloud.activepieces.com/api/v1
