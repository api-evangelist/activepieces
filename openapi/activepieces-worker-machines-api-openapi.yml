openapi: 3.2.0
info:
  title: Activepieces Worker Machines API
  x-refined-note:
  - x-generated-from differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged worker-machines across 2 of this provider''s published API definitions: activepieces-openapi.json, activepieces.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://cloud.activepieces.com/api
  description: Production Server
- url: https://cloud.activepieces.com/api/v1
  description: Activepieces Cloud API
- url: https://{yourDomain}/api/v1
  description: Self-hosted Activepieces instance
  variables:
    yourDomain:
      default: localhost:3000
tags:
- name: worker-machines
paths:
  /v1/worker-machines/queue-metrics:
    get:
      tags:
      - worker-machines
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  queues:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        waiting:
                          type: number
                        active:
                          type: number
                      required:
                      - name
                      - waiting
                      - active
                      additionalProperties: false
                required:
                - queues
                additionalProperties: false
      summary: Get worker machines queue metrics
      x-summary-source: derived
      operationId: getV1WorkerMachinesQueueMetrics
      x-operation-id-source: derived
    servers:
    - url: https://cloud.activepieces.com/api
      description: Production Server
  /worker/queues:
    get:
      operationId: getWorkerQueueMetrics
      summary: Activepieces Get Worker Queue Metrics
      description: Retrieve queue metrics for worker machines
      tags:
      - worker-machines
      responses:
        '200':
          description: Queue metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueMetrics'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - BearerAuth: []
    servers:
    - url: https://cloud.activepieces.com/api/v1
      description: Activepieces Cloud API
    - url: https://{yourDomain}/api/v1
      description: Self-hosted Activepieces instance
      variables:
        yourDomain:
          default: localhost:3000
components:
  schemas:
    QueueMetrics:
      type: object
      description: Worker queue metrics
      properties:
        queues:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Queue name
                example: one-time
              waiting:
                type: integer
                description: Jobs waiting
                example: 5
              active:
                type: integer
                description: Jobs active
                example: 2
              completed:
                type: integer
                description: Jobs completed
                example: 1000
              failed:
                type: integer
                description: Jobs failed
                example: 3
  securitySchemes:
    apiKey:
      type: http
      description: Use your api key generated from the admin console
      scheme: bearer
    BearerAuth:
      type: http
      scheme: bearer
      description: API key from the Activepieces admin console, passed as a Bearer token
externalDocs:
  url: https://www.activepieces.com/docs
  description: Find more info here
x-refined-from:
- activepieces-openapi.json
- activepieces.json
