components:
  schemas:
    Flow:
      type: object
      description: An Activepieces automation flow
      properties:
        id:
          type: string
          description: Unique flow identifier
          example: flow-abc123
        created:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2025-03-15T14:30:00Z'
        updated:
          type: string
          format: date-time
          description: Last updated timestamp
          example: '2025-03-15T14:30:00Z'
        projectId:
          type: string
          description: Associated project ID
          example: project-xyz789
        externalId:
          type: string
          description: External ID for the flow
        displayName:
          type: string
          description: Human-readable flow name
          example: Send Welcome Email
        status:
          type: string
          enum:
          - ENABLED
          - DISABLED
          description: Flow status
          example: ENABLED
        folderId:
          type: string
          description: Folder ID if organized in a folder
        publishedVersionId:
          type: string
          description: ID of the published version
    UpdateFlowRequest:
      type: object
      description: Request body for updating a flow
      properties:
        displayName:
          type: string
          description: New flow name
        status:
          type: string
          enum:
          - ENABLED
          - DISABLED
          description: Flow status
        folderId:
          type: string
          description: Move to this folder
    CreateFlowRequest:
      type: object
      required:
      - displayName
      - projectId
      description: Request body for creating a flow
      properties:
        displayName:
          type: string
          description: Flow display name
          example: My New Flow
        projectId:
          type: string
          description: Project ID to create flow in
          example: project-xyz789
        folderId:
          type: string
          description: Optional folder ID
        templateId:
          type: string
          description: Optional template to base the flow on
        metadata:
          type: object
          description: Custom metadata
    FlowList:
      type: object
      description: Paginated list of flows
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Flow'
          description: Array of flows
        next:
          type: string
          nullable: true
          description: Cursor to next page
        previous:
          type: string
          nullable: true
          description: Cursor to previous page
  securitySchemes:
    apiKey:
      type: http
      description: Use your api key generated from the admin console
      scheme: bearer
    BearerAuth:
      type: http
      scheme: bearer
      description: API key from the Activepieces admin console, passed as a Bearer token
externalDocs:
  url: https://www.activepieces.com/docs
  description: Find more info here
