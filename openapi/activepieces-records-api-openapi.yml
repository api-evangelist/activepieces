                  - exists
              required:
              - fieldId
              - operator
            - type: object
              properties:
                fieldId:
                  type: string
                operator:
                  type: string
                  enum:
                  - not_exists
              required:
              - fieldId
              - operator
        in: query
        name: filters
        required: true
      security:
      - apiKey: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        created:
                          type: string
                        updated:
                          type: string
                        tableId:
                          type: string
                        projectId:
                          type: string
                        cells:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties:
                            type: object
                            properties:
                              updated:
                                type: string
                              created:
                                type: string
                              value: {}
                              fieldName:
                                type: string
                            required:
