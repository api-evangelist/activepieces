                            - created
                            - value
                            - fieldName
                            additionalProperties: false
                      required:
                      - id
                      - created
                      - updated
                      - tableId
                      - projectId
                      - cells
                      additionalProperties: false
                  next:
                    anyOf:
                    - type: string
                    - type: 'null'
                  previous:
                    anyOf:
