      description: Activepieces Cloud API
    - url: https://{yourDomain}/api/v1
      description: Self-hosted Activepieces instance
      variables:
        yourDomain:
          default: localhost:3000
components:
  schemas:
    UpdateFolderRequest:
      type: object
      properties:
        displayName:
          type: string
          description: New folder name
    Folder:
      type: object
      description: A folder for organizing flows
      properties:
        id:
          type: string
          description: Folder ID
          example: folder-abc123
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        displayName:
          type: string
          description: Folder display name
          example: Production Flows
        projectId:
          type: string
          description: Project ID
    FolderList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Folder'
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
    CreateFolderRequest:
      type: object
      required:
      - displayName
      - projectId
      properties:
        displayName:
          type: string
          description: Folder name
          example: My Folder
        projectId:
          type: string
          description: Project ID
  securitySchemes:
    apiKey:
      type: http
      description: Use your api key generated from the admin console
      scheme: bearer
    BearerAuth:
      type: http
      scheme: bearer
      description: API key from the Activepieces admin console, passed as a Bearer token
externalDocs:
  url: https://www.activepieces.com/docs
  description: Find more info here
