      security:
      - apiKey: []
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/app-connection'
      summary: Create global connections
      x-summary-source: derived
      operationId: postV1GlobalConnections
      x-operation-id-source: derived
    get:
      tags:
      - global-connections
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
      - schema:
          type: string
          enum:
          - PROJECT
          - PLATFORM
        in: query
        name: scope
        required: false
      - schema:
          type: string
        in: query
        name: pieceName
        required: false
      - schema:
          type: string
        in: query
        name: displayName
        required: false
      - schema:
          type: array
          items:
            type: string
            enum:
            - ACTIVE
            - MISSING
            - ERROR
        in: query
        name: status
        required: true
      - schema:
          type: number
        in: query
        name: limit
        required: false
      security:
      - apiKey: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/app-connection'
                  next:
                    anyOf:
                    - type: string
                    - type: 'null'
                  previous:
                    anyOf:
                    - type: string
                    - type: 'null'
                required:
                - data
                additionalProperties: false
      summary: Get global connections
      x-summary-source: derived
      operationId: getV1GlobalConnections
      x-operation-id-source: derived
  /v1/global-connections/{id}:
    post:
      tags:
      - global-connections
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  minLength: 1
                projectIds:
                  type: array
                  items:
                    type: string
                metadata:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
                preSelectForNewProjects:
                  type: boolean
              required:
              - displayName
        required: true
      parameters:
      - schema:
          type: string
          pattern: ^[0-9a-zA-Z]{21}$
        in: path
        name: id
        required: true
      security:
      - apiKey: []
      responses:
        '200':
          description: Default Response
      summary: Create global connections by id
      x-summary-source: derived
      operationId: postV1GlobalConnectionsById
      x-operation-id-source: derived
    delete:
      tags:
      - global-connections
      parameters:
      - schema:
          type: string
          pattern: ^[0-9a-zA-Z]{21}$
        in: path
        name: id
        required: true
      security:
      - apiKey: []
      responses:
        '204':
          description: Default Response
          content:
            application/json:
              schema:
                not: {}
      summary: Delete global connections by id
      x-summary-source: derived
      operationId: deleteV1GlobalConnectionsById
      x-operation-id-source: derived
components:
  schemas:
    user:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/user'
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        externalId:
          anyOf:
          - type: string
          - type: 'null'
        platformId:
          anyOf:
          - type: string
          - type: 'null'
        platformRole:
          type: string
          enum:
          - ADMIN
          - MEMBER
          - OPERATOR
        lastName:
          type: string
        created:
          type: string
        updated:
          type: string
        lastActiveDate:
          anyOf:
          - type: string
          - type: 'null'
        imageUrl:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - email
      - firstName
      - status
      - platformRole
      - lastName
      - created
      - updated
      additionalProperties: false
    app-connection:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/app-connection'
      type: object
      properties:
        id:
          type: string
        created:
          type: string
        updated:
          type: string
        externalId:
          type: string
        displayName:
          type: string
        type:
          type: string
          enum:
          - OAUTH2
          - PLATFORM_OAUTH2
          - CLOUD_OAUTH2
          - SECRET_TEXT
          - BASIC_AUTH
          - CUSTOM_AUTH
          - NO_AUTH
        pieceName:
          type: string
        projectIds:
          type: array
          items:
            type: string
            pattern: ^[0-9a-zA-Z]{21}$
        platformId:
          anyOf:
          - type: string
          - type: 'null'
        scope:
          type: string
          enum:
          - PROJECT
          - PLATFORM
        status:
          type: string
          enum:
          - ACTIVE
          - MISSING
          - ERROR
        ownerId:
          anyOf:
          - type: string
          - type: 'null'
        owner:
          anyOf:
          - $ref: '#/components/schemas/user'
          - type: 'null'
        metadata:
          anyOf:
          - type: object
            propertyNames:
              type: string
            additionalProperties: {}
          - type: 'null'
        flowIds:
          anyOf:
          - type: array
            items:
              type: string
              pattern: ^[0-9a-zA-Z]{21}$
          - type: 'null'
        pieceVersion:
          type: string
        preSelectForNewProjects:
          type: boolean
        usingSecretManager:
          type: boolean
      required:
      - id
      - created
      - updated
      - externalId
      - displayName
      - type
      - pieceName
      - projectIds
      - scope
      - status
      - pieceVersion
      - preSelectForNewProjects
      - usingSecretManager
      additionalProperties: false
  securitySchemes:
    apiKey:
      type: http
      description: Use your api key generated from the admin console
      scheme: bearer
externalDocs:
  url: https://www.activepieces.com/docs
  description: Find more info here
