openapi: 3.2.0
info:
  title: Activepieces Documentation Project Members API
  version: 0.0.0
servers:
- url: https://cloud.activepieces.com/api
  description: Production Server
tags:
- name: project-members
paths:
  /v1/project-members:
    get:
      tags:
      - project-members
      parameters:
      - schema:
          type: string
        in: query
        name: projectId
        required: true
      - schema:
          type: string
        in: query
        name: projectRoleId
        required: false
      - schema:
          type: string
        in: query
        name: cursor
        required: false
      - schema:
          type: number
        in: query
        name: limit
        required: false
      security:
      - apiKey: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        created:
                          type: string
                        updated:
                          type: string
                        platformId:
                          type: string
                          pattern: ^[0-9a-zA-Z]{21}$
                        userId:
                          type: string
                          pattern: ^[0-9a-zA-Z]{21}$
                        projectId:
                          type: string
                        projectRoleId:
                          type: string
                          pattern: ^[0-9a-zA-Z]{21}$
                        user:
                          $ref: '#/components/schemas/user'
                        projectRole:
                          type: object
                          properties:
                            id:
                              type: string
                            created:
                              type: string
                            updated:
                              type: string
                            name:
                              type: string
                            permissions:
                              type: array
                              items:
                                type: string
                            platformId:
                              anyOf:
                              - type: string
                              - type: 'null'
                            type:
                              type: string
                            userCount:
                              type: number
                          required:
                          - id
                          - created
                          - updated
                          - name
                          - permissions
                          - type
                          additionalProperties: false
                        project:
                          type: object
                          properties:
                            id:
                              type: string
                            displayName:
                              type: string
                          required:
                          - id
                          - displayName
                          additionalProperties: false
                      required:
                      - id
                      - created
                      - updated
                      - platformId
                      - userId
                      - projectId
                      - projectRoleId
                      - user
                      - projectRole
                      - project
                      additionalProperties: false
                  next:
                    anyOf:
                    - type: string
                    - type: 'null'
                  previous:
                    anyOf:
                    - type: string
                    - type: 'null'
                required:
                - data
                additionalProperties: false
      summary: Get project members
      x-summary-source: derived
      operationId: getV1ProjectMembers
      x-operation-id-source: derived
  /v1/project-members/{id}:
    delete:
      tags:
      - project-members
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
      security:
      - apiKey: []
      responses:
        '204':
          description: Default Response
          content:
            application/json:
              schema:
                not: {}
      summary: Delete project members by id
      x-summary-source: derived
      operationId: deleteV1ProjectMembersById
      x-operation-id-source: derived
  /v1/project-roles/{id}/project-members:
    get:
      tags:
      - project-members
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
      - schema:
          type: number
        in: query
        name: limit
        required: false
      - schema:
          type: string
          pattern: ^[0-9a-zA-Z]{21}$
        in: path
        name: id
        required: true
      security:
      - apiKey: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        created:
                          type: string
                        updated:
                          type: string
                        platformId:
                          type: string
                          pattern: ^[0-9a-zA-Z]{21}$
                        userId:
                          type: string
                          pattern: ^[0-9a-zA-Z]{21}$
                        projectId:
                          type: string
                        projectRoleId:
                          type: string
                          pattern: ^[0-9a-zA-Z]{21}$
                        user:
                          $ref: '#/components/schemas/user'
                        projectRole:
                          type: object
                          properties:
                            id:
                              type: string
                            created:
                              type: string
                            updated:
                              type: string
                            name:
                              type: string
                            permissions:
                              type: array
                              items:
                                type: string
                            platformId:
                              anyOf:
                              - type: string
                              - type: 'null'
                            type:
                              type: string
                            userCount:
                              type: number
                          required:
                          - id
                          - created
                          - updated
                          - name
                          - permissions
                          - type
                          additionalProperties: false
                        project:
                          type: object
                          properties:
                            id:
                              type: string
                            displayName:
                              type: string
                          required:
                          - id
                          - displayName
                          additionalProperties: false
                      required:
                      - id
                      - created
                      - updated
                      - platformId
                      - userId
                      - projectId
                      - projectRoleId
                      - user
                      - projectRole
                      - project
                      additionalProperties: false
                  next:
                    anyOf:
                    - type: string
                    - type: 'null'
                  previous:
                    anyOf:
                    - type: string
                    - type: 'null'
                required:
                - data
                additionalProperties: false
      summary: Get project roles by id project members
      x-summary-source: derived
      operationId: getV1ProjectRolesByIdProjectMembers
      x-operation-id-source: derived
components:
  schemas:
    user:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/user'
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        externalId:
          anyOf:
          - type: string
          - type: 'null'
        platformId:
          anyOf:
          - type: string
          - type: 'null'
        platformRole:
          type: string
          enum:
          - ADMIN
          - MEMBER
          - OPERATOR
        lastName:
          type: string
        created:
          type: string
        updated:
          type: string
        lastActiveDate:
          anyOf:
          - type: string
          - type: 'null'
        imageUrl:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - email
      - firstName
      - status
      - platformRole
      - lastName
      - created
      - updated
      additionalProperties: false
  securitySchemes:
    apiKey:
      type: http
      description: Use your api key generated from the admin console
      scheme: bearer
externalDocs:
  url: https://www.activepieces.com/docs
  description: Find more info here
