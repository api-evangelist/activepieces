openapi: 3.2.0
info:
  title: Activepieces Documentation MCP OAUTH API
  version: 0.0.0
servers:
- url: https://cloud.activepieces.com/api
  description: Production Server
tags:
- name: mcp-oauth
paths:
  /v1/mcp-oauth/approve:
    post:
      tags:
      - mcp-oauth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                authRequestId:
                  type: string
                projectId:
                  type: string
              required:
              - authRequestId
        required: true
      responses:
        '200':
          description: Default Response
      summary: Create mcp oauth approve
      x-summary-source: derived
      operationId: postV1McpOauthApprove
      x-operation-id-source: derived
components:
  securitySchemes:
    apiKey:
      type: http
      description: Use your api key generated from the admin console
      scheme: bearer
externalDocs:
  url: https://www.activepieces.com/docs
  description: Find more info here
